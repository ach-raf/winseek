[package]
name = "winseek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "winseek desktop app (popup + library UI)"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
serde = { workspace = true }
serde_json = { workspace = true }
winseek-ipc = { path = "../../crates/ipc" }

[build-dependencies]
tauri-build = "2"

[[bin]]
name = "winseek-app"
path = "src/main.rs"
