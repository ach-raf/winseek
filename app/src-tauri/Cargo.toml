[package]
name = "winseek-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "winseek desktop app (popup + library UI)"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
winseek-ipc = { path = "../../crates/ipc" }
winseek-store = { path = "../../crates/store" }
winseek-llama = { path = "../../crates/llama" }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Power",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    # Windows.Media.Ocr (Tier 1 screenshot OCR)
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }
kamadak-exif = "0.6.1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "winseek-app"
path = "src/main.rs"
