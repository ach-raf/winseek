[workspace]
resolver = "2"
members = [
    "crates/ntfs",
    "crates/folder",
    "crates/index",
    "crates/usn",
    "crates/ipc",
    "crates/store",
    "crates/llama",
    "tools/eval",
    "searchd",
    "mcp",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
