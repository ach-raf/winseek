name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI — types, lint, tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/ui/package-lock.json

      - name: Install JS dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix app/ui

      - name: Type check (strict, includes tests)
        working-directory: app/ui
        run: npx tsc --noEmit

      - name: Lint (errors gate; warnings are advisory)
        working-directory: app/ui
        run: npx eslint src --quiet

      - name: UI tests
        run: npm test --prefix app/ui

  rust:
    name: Rust — fmt, clippy, tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      # -D warnings: the workspace is clippy-clean, so it stays that way.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # One package at a time. Only the crates that need no
      # elevated volume access or GPU.
      - name: Tests
        shell: pwsh
        run: |
          foreach ($p in 'winseek-index','winseek-ipc','winseek-usn','winseek-store','winseek-folder','winseek-llama') {
            cargo test -p $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  installer:
    name: Build installer
    needs: [ui, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/ui/package-lock.json

      - name: Install JS dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix app/ui

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipNpm

      - uses: actions/upload-artifact@v4
        with:
          name: winseek-installer-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
