name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test and build installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/ui/package-lock.json

      - name: Install JS dependencies
        run: |
          npm ci --prefix app
          npm ci --prefix app/ui

      - name: UI tests
        run: npm test --prefix app/ui

      # One package at a time. Only the crates that need no
      # elevated volume access or GPU.
      - name: Rust tests
        shell: pwsh
        run: |
          foreach ($p in 'winseek-index','winseek-ipc','winseek-usn','winseek-store','winseek-folder','winseek-llama') {
            cargo test -p $p
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipNpm

      - uses: actions/upload-artifact@v7
        with:
          name: winseek-installer-${{ github.sha }}
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
